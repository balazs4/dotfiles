git_protocol: ssh
aliases:
  iss: >-
    !gh issue list ${*} | fzf --reverse --no-sort --preview 'printf "%s\n" {}; gh issue view {1} --comments' --preview-window=right,75%

  r: >-
    !gh run list --workflow .github/workflows/main.yaml | fzf --reverse --no-sort --preview 'gh run view --log --job {8}'
     # gh run view --log --job

  hive: >-
    !GH_TOKEN=$GH_TOKEN_HIVE gh cs ssh -c $(GH_TOKEN=$GH_TOKEN_HIVE gh cs ls --json name --jq '.[0].name' | fzf -1)

  checks: >-
    !gh pr checks --json 'name,link,state' --template '{{range .}}{{tablerow .state .name .link }}{{end}}' | sort -r

  checksw: >-
    !gh pr checks --watch; say "pr checks are done for $(git remote get-url origin)"

  prs: >-
    !gh api graphql -f query="
        {
          search(query: \"type:pr state:${GH_PR_STATE:-open} sort:created-desc involves:@me archived:false\", type: ISSUE, first: 20) {
            edges { node { ... on PullRequest { title url createdAt author { ... on User {login} } } } }
          }
        }" \
        | fx 'x => x.data.search.edges.map(xx => [xx.node.createdAt, xx.node.url.padEnd(48), xx.node.author.login.padEnd(32), xx.node.title.substring(0,96)].join("\t")).join("\n")' \
        | fzf --reverse --preview-window=bottom --preview 'gh pr view {2}' \
        | xurls \
        | xargs -t -I{} gh pr ${*:-view} {}
