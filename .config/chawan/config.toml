[buffer]
cookie = false
images = false
meta-refresh = "always"
scripting = false
styling = true

[display]
color-mode = "auto"
image-mode = "none"

[external]
copy-cmd = "xclip -i -rmlastnl -selection clipboard"
paste-cmd = "xclip -o -selection clipboard"
mailcap = [ "~/.config/chawan/mailcap" ]

[page]
' d' = "pager.externFilterSource('reader \"$CHA_URL\" --raw')"
' f' = "pager.externFilterSource('fmt')"
' r' = "pager.externFilterSource('rdrview -T url,title,body -H \"$CHA_URL\"')"
C-k = "() => pager.load('ddg:')"
o = "loadEmpty"

[[siteconf]]
url = '^https://hup.hu/.*'
styling = false

[[siteconf]]
url = '^https://news.ycombinator.com/.*'
styling = true

[[siteconf]]
url = '^https://(www\.|[^old]\.)?reddit\.com/.*'
rewrite-url = 'x => { x.host = "redlib.catsarch.com" }'

[[siteconf]]
url = '^https://github.com/.*/blob/.*'
rewrite-url = 'x => { x.search = "raw=true" }'
