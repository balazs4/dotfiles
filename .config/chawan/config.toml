[buffer]
cookie = false
images = false
scripting = false
styling = true

[external]
copy-cmd = 'xclip -i -rmlastnl -selection clipboard'
paste-cmd = 'xclip -o -selection clipboard'
mailcap = [
  "~/.config/chawan/mailcap"
]

[page]
':' = 'cmd.pager.enterCommand'
C-k = '() => pager.load("ddg:")'
o = '() => pager.load("ddg:")'
yy = 'cmd.pager.copyURL'
