[buffer]
cookie = "save"
images = false
meta-refresh = "always"
scripting = false
styling = true

[display]
color-mode = "auto"
image-mode = "none"

[external]
copy-cmd = "xclip -i -rmlastnl -selection clipboard"
paste-cmd = "xclip -o -selection clipboard"
mailcap = [ "~/.config/chawan/mailcap" ]
bookmark = "~/.local/share/chawan/bookmark.md"
history-file = "~/.local/share/chawan/history.uri"
history-size = 10000
cookie-file = "~/.local/share/chawan/cookies.txt"

[page]
' d' = "pager.externFilterSource('reader \"$CHA_URL\" --raw')"
' f' = "pager.externFilterSource('fmt')"
' r' = "pager.externFilterSource('rdrview -T url,title,body -H \"$CHA_URL\" | fmt')"
C-k = "() => pager.load('ddg:')"
o = "loadEmpty"

[[siteconf]]
url = '^https://(.*\.)?sr.ht/.*'
cookie = true
share-cookie-jar = 'sr.ht'

[[siteconf]]
url = '^https://(www\.|[^old]\.)?reddit\.com/.*'
rewrite-url = 'x => { x.host = "old.reddit.com" }'

[[siteconf]]
url = '^https://github.com/.*/blob/.*'
rewrite-url = 'x => { x.search = "raw=true" }'

[[siteconf]]
url = "https://hup.hu/.*"
styling = false

