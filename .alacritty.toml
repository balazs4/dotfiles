[general]
working_directory = "/home/balazs4/"

[font]
#carbon size = 11.0
#aspire size = 12.0
#aspire #normal = { family = "DejaVu Sans Mono", style = "Regular" }
#aspire #normal = { family = "Noto Sans Mono", style = "Regular" }
#aspire #normal = { family = "JetBrains Mono", style = "Regular" }
#aspire #normal = { family = "Geist Mono Nerd Font", style = "Regular" }
#aspire #normal = { family = "Hack Nerd Font Mono", style = "Regular" }
#aspire #normal = { family = "Roboto Mono Nerd Font", style = "Regular" }

[window]
opacity = 0.96
decorations = "None"
dynamic_title = true
title = "alacritty"
class = { general = "alacritty", instance = "alacritty" }

[colors.primary]
background = "0x{{base00-hex}}"
foreground = "0x{{base05-hex}}"

[colors.cursor]
cursor = "0x{{base09-hex}}"
#cursor = "0x{{base0A-hex}}" # black-metal
text = "0x{{base00-hex}}"

[colors.normal]
black = "0x{{base00-hex}}"
blue = "0x{{base0D-hex}}"
cyan = "0x{{base0C-hex}}"
green = "0x{{base0B-hex}}"
magenta = "0x{{base0E-hex}}"
red = "0x{{base08-hex}}"
white = "0x{{base05-hex}}"
yellow = "0x{{base0A-hex}}"

[colors.bright]
black = "0x{{base03-hex}}"
blue = "0x{{base0D-hex}}"
cyan = "0x{{base0C-hex}}"
green = "0x{{base0B-hex}}"
magenta = "0x{{base0E-hex}}"
red = "0x{{base08-hex}}"
white = "0x{{base07-hex}}"
yellow = "0x{{base0A-hex}}"

