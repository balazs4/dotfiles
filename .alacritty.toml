[general]
#carbon working_directory = "/home/balazs4/"
#mcbpro working_directory = "/Users/balazs4/"

[window]
opacity = 0.86
decorations = "None"
dynamic_title = true
title = "alacritty"
class = { general = "alacritty", instance = "alacritty" }

[font]
#mcbpro normal = { family = "GeistMono Nerd Font", style = "Medium" }
#mcbpro size = 14.0
#carbon normal = { family = "Geist Mono", style = "Medium" }
#carbon size = 11.0


# https://github.com/tinted-theming/tinted-terminal/blob/bf2479b4e16dccad4b345fb692dfcee40e724964/templates/alacritty-base24.mustache
# {{scheme-system}} {{scheme-name}} 256 - alacritty color config
# {{scheme-author}}

# Default colors
[colors.primary]
background = '0x{{base00-hex}}'
foreground = '0x{{base05-hex}}'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text = '0x{{base00-hex}}'
# cursor = '0x{{base05-hex}}'
cursor = '0x{{base09-hex}}'

# Normal colors
[colors.normal]
black = '0x{{base01-hex}}'
red = '0x{{base08-hex}}'
green = '0x{{base0B-hex}}'
yellow = '0x{{base0A-hex}}'
blue = '0x{{base0D-hex}}'
magenta = '0x{{base0E-hex}}'
cyan = '0x{{base0C-hex}}'
white = '0x{{base06-hex}}'

# Bright colors
[colors.bright]
black = '0x{{base02-hex}}'
red = '0x{{base12-hex}}'
green = '0x{{base14-hex}}'
yellow = '0x{{base13-hex}}'
blue = '0x{{base16-hex}}'
magenta = '0x{{base17-hex}}'
cyan = '0x{{base15-hex}}'
white = '0x{{base07-hex}}'

[[colors.indexed_colors]]
index = 16
color = "0x{{base09-hex}}"

[[colors.indexed_colors]]
index = 17
color = "0x{{base0F-hex}}"

[[colors.indexed_colors]]
index = 18
color = "0x{{base01-hex}}"

[[colors.indexed_colors]]
index = 19
color = "0x{{base02-hex}}"

[[colors.indexed_colors]]
index = 20
color = "0x{{base04-hex}}"

[[colors.indexed_colors]]
index = 21
color = "0x{{base06-hex}}"
