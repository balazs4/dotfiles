# vim: set ft=tmux tw=0 nowrap:
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g base-index 1
setw -g pane-base-index 1

set -sg escape-time 0
set -g mouse on
set -g focus-events on

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key / copy-mode \; send-key ?

bind-key u run-shell -b 'tmux capture-pane -p | xurls | sort | uniq | fzf --tmux -1 | xargs -t -I{} xdg-open {} > /dev/null || true'
bind-key U run-shell -b 'tmux capture-pane -p | fzf --tmux=bottom --reverse | xurls | xargs -t -I{} xdg-open {} > /dev/null || true'
bind-key m attach-session -c "#{pane_current_path}" \; rename-session "#{pane_current_path}"
#mcbpro bind-key space run-shell -b "aerospace list-windows --all | fzf --bind 'enter:execute(bash -c \"aerospace focus --window-id {1}\")+abort' --tmux || true" # inspired by https://www.youtube.com/watch?v=5nwnJjr5eOo&t=438s

bind = select-layout even-horizontal
bind - select-layout tiled

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


primary="#333333"
secondary="#aaaaaa"
accent="#{{base09-hex}}"
white="#ffffff"

set -g status-style "bg=$primary fg=$secondary"
set -g message-command-style "bg=$accent fg=$primary bold"
set -g message-style "bg=$accent fg=$primary bold"
set -g mode-style "bg=$secondary fg=$primary"
set -g pane-border-style "fg=$primary"
set -g pane-active-border-style "fg=$secondary"
set -g window-status-current-style "fg=$white bold"
set -g window-status-style "bg=$primary fg=$secondary"
set -g clock-mode-colour "$accent"
set -g display-panes-active-colour "$accent"
set -g display-panes-colour "$secondary"

set-option -g status-left "#[bold]#S |  "
set-option -g status-left-length 1024
set-option -g status-right "#{?client_prefix,#[bold]#[fg=$accent]C-b#[nobold]#[fg=default],} #[bold]#(tmux capture-pane -p -t radio | awk -F':' '/icy-title:/ {print $2}' | tail -1 )#(tmux capture-pane -p -t ncspot | tail -1 | cut -d'@' -f2)#[nobold] | %Y-%m-%d #[bold]%H:%M (kw:%V)"
set-option -g status-right-length 1024
